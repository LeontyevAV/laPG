{% extends "base.html" %}
{% block content %}
<h1>Инструменты</h1>

<div id="server-selector" style="margin-bottom:1.5rem">
  <label for="server-picker">Сервер:</label>
  <select id="server-picker" onchange="loadTools(this.value)">
    <option value="">— выберите сервер —</option>
    {% for s in servers %}
    <option value="{{ s.name }}">{{ s.name }} ({{ s.user }}@{{ s.host }})</option>
    {% endfor %}
  </select>
</div>

<div id="tools-output" style="display:none">
  <div id="tools-grid"></div>
  <div id="tools-terminal" class="terminal-box" style="display:none;margin-top:1rem">
    <div class="terminal-header">Выполнение</div>
    <pre class="terminal-body" id="tools-terminal-text"></pre>
    <div class="terminal-status" id="tools-terminal-status"></div>
  </div>
</div>

<div id="tools-no-server" class="muted" style="margin-top:1rem">Выберите сервер для проверки доступных инструментов</div>

<script>
function loadTools(serverName) {
  var out = document.getElementById('tools-output');
  var noServer = document.getElementById('tools-no-server');
  var grid = document.getElementById('tools-grid');
  if (!serverName) {
    out.style.display = 'none';
    noServer.style.display = '';
    return;
  }
  out.style.display = '';
  noServer.style.display = 'none';
  grid.innerHTML = '<p class="muted">⏳ Загрузка...</p>';
  fetch('/tools/' + serverName + '/status')
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.error) {
        grid.innerHTML = '<div class="toast toast-fail">' + data.error + '</div>';
        return;
      }
      var html = '';
      var categories = {{ categories | tojson }};
      var tools = {{ tools | tojson }};
      var byCat = {};
      for (var i = 0; i < tools.length; i++) {
        var cat = tools[i].category;
        if (!byCat[cat]) byCat[cat] = [];
        byCat[cat].push(tools[i]);
      }
      for (var cat in byCat) {
        html += '<h3 style="margin-top:1.5rem">' + (categories[cat] || cat) + '</h3>';
        html += '<div class="tool-grid">';
        for (var i = 0; i < byCat[cat].length; i++) {
          var t = byCat[cat][i];
          var status = null;
          for (var j = 0; j < data.tools.length; j++) {
            if (data.tools[j].id === t.id) { status = data.tools[j]; break; }
          }
          var installed = status && status.installed;
          html += '<div class="tool-card' + (installed ? ' tool-installed' : '') + '">';
          html += '<div class="tool-icon">' + t.icon + '</div>';
          html += '<div class="tool-info">';
          html += '<div class="tool-name">' + t.name + '</div>';
          html += '<div class="tool-desc">' + t.desc + '</div>';
          if (installed && status.version) {
            html += '<div class="tool-version">' + status.version + '</div>';
          }
          html += '</div>';
          html += '<div class="tool-action">';
          if (installed) {
            html += '<span class="tool-installed-label">✓ Установлено</span>';
          } else {
            html += '<button class="btn btn-primary btn-sm" onclick="installTool(\'' + serverName + '\',\'' + t.id + '\')">Установить</button>';
          }
          html += '</div>';
          html += '</div>';
        }
        html += '</div>';
      }
      grid.innerHTML = html;
    })
    .catch(function(e) {
      grid.innerHTML = '<div class="toast toast-fail">Ошибка: ' + e.message + '</div>';
    });
}

function installTool(serverName, toolId) {
  var term = document.getElementById('tools-terminal');
  var text = document.getElementById('tools-terminal-text');
  var status = document.getElementById('tools-terminal-status');
  term.style.display = '';
  text.textContent = '$ Установка...';
  status.className = 'terminal-status terminal-status-run';
  status.textContent = '⏳ Выполняется...';
  fetch('/tools/' + serverName + '/install/' + toolId, {method:'POST'})
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.ok) {
        status.className = 'terminal-status terminal-status-ok';
        status.textContent = '✓ Готово';
        text.textContent += '\n' + (data.output || '');
        loadTools(serverName);
      } else {
        status.className = 'terminal-status terminal-status-fail';
        status.textContent = '✗ Ошибка';
        text.textContent += '\n' + (data.error || '');
      }
    });
}
</script>

<style>
.tool-grid { display:flex; flex-wrap:wrap; gap:.6rem; margin-top:.5rem; }
.tool-card { display:flex; align-items:center; gap:.6rem; padding:.7rem; border:1px solid var(--border); border-radius:var(--radius); width:100%; max-width:480px; background:var(--bg-card,#fafafa); }
.tool-installed { border-color:#4caf50; background:#f1f8e9; }
.tool-icon { font-size:1.6rem; }
.tool-info { flex:1; min-width:0; }
.tool-name { font-weight:600; }
.tool-desc { font-size:.8rem; color:var(--muted); }
.tool-version { font-size:.8rem; color:#2e7d32; margin-top:.15rem; }
.tool-installed-label { font-size:.8rem; color:#2e7d32; font-weight:600; white-space:nowrap; }
.tool-action { flex-shrink:0; }
</style>
{% endblock %}
