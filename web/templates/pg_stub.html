{% extends "base.html" %}
{% block content %}
<h1>{{ db }}</h1>
<p class="muted">{{ server }}</p>
<div class="card" style="padding:3rem;text-align:center;margin-top:2rem">
  <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="color:var(--muted);margin-bottom:1rem"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>
  <h3 style="color:var(--muted)">PostgreSQL-редактор в разработке</h3>
  <p class="muted">Открыть базу можно через pgAdmin, DBeaver или <code>psql -h {{ server }} -d {{ db }}</code></p>
</div>
<p style="margin-top:1rem"><a href="/bots/services" class="btn">← К проектам</a></p>
{% endblock %}
